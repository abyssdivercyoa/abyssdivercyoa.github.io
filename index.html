<!DOCTYPE html>
<html lang="en">
<head>
<title>Abyss Diver</title>
</head>
	
<style>

	margin-top : 10px;

#navTable .cell + .cell, #navTable .sub div + div, #navJump .jl + .jl { margin-top : -1px; }

#navTable .sub { display : none; position : absolute; left : 100%; top : -1px; min-width : 130px; z-index : 3; }

#navTable .cell:hover { background-color : #222; }
#navTable .sub div:hover, #navJump .jl:hover { background-color : #444; }
.cell {

	cursor : pointer;

#pageContainer {

}

}
.overlay:hover {

}

.overlay.blocked { cursor : not-allowed; }
.overlay.blocked:hover { border : 4px solid red; }

	display : none;
	position : fixed;

	max-width : 320px;

	color : #fff;
	border : 2px solid orange;
	border-radius : 8px;
	font-size : 13px;
	pointer-events : none;
	-webkit-user-select : none;
	user-select : none;
}
.moreRound {
	border-radius : 18px;
}
#infoButton {

	right : 5px;
	top : 5px;

	width : 45px;
	height : 45px;
	font-size : 30px;

	opacity : 0.3;
	z-index : 3;

#infoButton:hover {
	opacity : 1;
}
#info {
	position : fixed;
	right : 10px;
	top : 5px;
	width : 35vh;
	height : 98vh;
	border-radius : 15px;
	border : 3px solid gray;
	background-color : gray;
	opacity : 0.9;
	z-index : 2;
	text-align : left;
}
#actions {

	align-items : center;
	gap : 4px;
	white-space : nowrap;
	margin-top : 5px;
}
#actions select {
	flex : 1 1 0;
	min-width : 0;
}
#log, #actions select {
	background-color : black;
	color : white;
}
#infoContainer {
	height : 80vh;
	margin-left : 5px;
	padding-right : 5px;
	overflow-y : auto;
}
#log {
	position : absolute;
	right : 5px;
	bottom : 10px;
	width : 33vh;
	height : 14.5vh;
}

	margin-top : 1px;
	margin-bottom : 1px;
	height : 2px;
	background-color : black;
}
#dlgBack {

	left : 0px;
	top : 0px;
	width : 100%;
	height : 100%;

	align-items : center;

	color : #fff;

	font-size : 14px;

	gap : 10px;
	margin-top : 10px;

.dlgField { flex : 1 1 0; min-width : 0; }

	color : #fff;

	border-radius : 4px;

.dlgAdd { margin-top : 8px; }
.dlgButtonSummary { margin-top : 4px; font-size : 12px; color : #ccc; white-space : pre-line; }
.dlgAdd:disabled { opacity : 0.4; cursor : not-allowed; }

	padding : 6px 8px;
	background : #111;

	border-radius : 4px;
	font-family : inherit;
	font-size : 14px;

		div += '" onmouseover="hoverOverlay(this, event)" onmousemove="moveTip(event)" onmouseout="hideTip()" onclick="clickOverlay(this, event)" oncontextmenu="return rightClickOverlay(this, event)"></div>';
		overlay += div;
	};
	get('pageContainer').innerHTML = overlay;
}

// ---- Undo, save and load (step BG). Every user action (a click, a right-click, an Actions-menu entry, a page jump) runs inside withUndo: the state before it is
// pushed on an unlimited stack when the action changed anything. A snapshot holds `character`, the Wonder visit counts, currentLayer, lastTripDays and the log text.
// Random rolls are not stored: undoing and repeating an action may give a different die result (ruled).
var logStep = null; // the running action's log bookkeeping: n = log length before it, p/s = start and original text of a pre-existing last line it merged into (null if none)
var undoStack = [], undoDepth = 0, SAVE_KEY = "abyssDiverSave", SAVE_VERSION = 1, UNDO_KEY = "abyssDiverUndo:", LOG_KEY = "abyssDiverLog:";
// The browser save is several keys: SAVE_KEY holds a small header (the state, how many undo steps and log chunks there are), UNDO_KEY+i holds undo step i and LOG_KEY+k the k-th piece of the log.
// `persist` describes what is stored now: steps base..count-1 and the first logLen characters of the log (in logChunks pieces). While ok, an autosave only has to add what is new
// (actions only ever push a step and append to the log); anything that rewrites history (restoreState: Undo, a cancelled action, Load/Import) clears ok and the next autosave rewrites everything.
var persist = {ok: false, base: 0, count: 0, logLen: 0, logChunks: 0};
function infReplacer(k, v) { if (typeof v == "number" && isFinite(v)) return Math.round(v*100)/100; return v === Infinity ? "__Infinity__" : v; } // saves round numbers to 2 decimals (removes float noise like 4.999999998 but keeps 0.25 from Minish-ish) // statuses last until cured: JSON has no Infinity
function infReviver(k, v) { return v === "__Infinity__" ? Infinity : v; }
function stateJSON() {
	var visits = {};
	Object.keys(wonders).forEach(function(k) { visits[k] = wonders[k][1]; });
	return JSON.stringify({character: character, wonderVisits: visits, currentLayer: currentLayer, lastTripDays: lastTripDays}, infReplacer);
}
function restoreState(json, logText) { // replaces the whole game state (in place, so every reference to `character` stays valid) and redraws the page

	var st = JSON.parse(json, infReviver);
	Object.keys(character).forEach(function(k) { delete character[k]; });
	Object.keys(st.character).forEach(function(k) { character[k] = st.character[k]; });
	Object.keys(st.wonderVisits).forEach(function(k) { if (wonders[k]) wonders[k][1] = st.wonderVisits[k]; });
	currentLayer = st.currentLayer; lastTripDays = st.lastTripDays;
	wonders["Empty-handed Broker"][2] = character.brokerCrumbled ? -1 : 1; // the rubble state follows the saved state (Undo of the first trip down brings the Broker back)
	cherryCtx = null; flyingNow = false; balloonFlight = false; balloonHopDays = 0;
	get('log').value = logText;
	refreshView();
}
function refreshView() { // redraw the page for the current state without the side effects of gotoPage (a paused crossing and the wings stay)
	var n = currentLayer;
	hideTip();
	get('pageContainer').style.backgroundImage = 'url("Assets/' + (n+1) + (n == 10 ? '.gif' : '.png') + '")';
	get('pageContainer').style.height = layers[n][1] + "px";
	var src = "Assets/" + (n+1) + ".mp3";
	if (get('track').getAttribute && get('track').getAttribute("src") != src) { get('track').src = src; get('player').load(); }
	renderOverlay(n);
	get('section-1').style.display = (n == 0) ? "" : "none";
	updateInfo();
	get('log').scrollTop = get('log').scrollHeight;
	schedulePreload(n);
}
function flatState() { // the state as {key: JSON text}, one key per character field (so a step can store only what it changed)
	var f = {}, visits = {};
	Object.keys(character).forEach(function(k) { var j = JSON.stringify(character[k], infReplacer); if (j !== undefined) f["c." + k] = j; });
	Object.keys(wonders).forEach(function(k) { visits[k] = wonders[k][1]; });
	f.w = JSON.stringify(visits); f.l = JSON.stringify(currentLayer); f.t = JSON.stringify(lastTripDays);
	return f;
}
function packageChanged(txt) { // a save has something to resume exactly when its undo history is not empty (every game action adds a step; page jumps don't); an unreadable package counts as changed
	try { return JSON.parse(txt).undo.length > 0; } catch (e) { return true; }
}
function stateFromFlat(f) { // back to the text restoreState expects
	var ch = {};
	Object.keys(f).forEach(function(k) { if (k.indexOf("c.") === 0) ch[k.slice(2)] = JSON.parse(f[k], infReviver); });
	return JSON.stringify({character: ch, wonderVisits: JSON.parse(f.w), currentLayer: JSON.parse(f.l), lastTripDays: JSON.parse(f.t)}, infReplacer);
}
// An undo step stores only the fields the action changed (their old values; null = the field did not exist) and the log length before it.
// The log only ever grows at its end (a repeated last line is merged into "(xN)", which rewrites just that one line: the step then also keeps that line's original text), so undo cuts it back to that length instead of every step keeping its own copy of the whole text.
function logBefore(log, n, e) { return e.s ? log.slice(0, e.p) + e.s : log.slice(0, Math.min(n, log.length)); } // the log as it was before a step: cut back to its old length, or, if the step merged into an older line, with that line restored
async function withUndo(fn) { // runs one user action; nested calls (an action that triggers others) are part of the same step

	undoDepth++;

	catch (e) { if (e !== DLG_CANCEL) throw e; cancelled = true; } // Cancel in any dialog: the whole action is rolled back below
	finally {
		undoDepth--; logStep = null;
		if (cancelled) { restoreState(stateFromFlat(before), logBefore(get('log').value, beforeLen, step)); autosave(); refreshMenu(); }
		else {
		var after = flatState(), u = {}, any = false;
		Object.keys(before).forEach(function(k) { if (before[k] !== after[k]) { u[k] = before[k]; any = true; } });
		Object.keys(after).forEach(function(k) { if (!(k in before)) { u[k] = null; any = true; } });
		if (any) { undoStack.push(step.s === null ? {u: u, n: beforeLen} : {u: u, n: beforeLen, p: step.p, s: step.s}); autosave(); refreshMenu(); } // the menu was last built during the action, before this step existed: rebuild so "Undo last action" appears
		}
		try { updateInfo(); } catch (e) { } // actions that end early (pause, refusal, Cancel) still leave the panel current
	}
}
function navTo(n) { gotoPage(n); if (undoStack.length > 0) autosave(); } // page jumps are not undoable (ruled, step BH); the next action's snapshot already records the page
async function actionPicked() { // choosing an entry runs it at once; the menu then returns to the placeholder so the same entry can be picked again
	var sel = get('actionSelect');
	if (!sel.value) return;
	await doAction();
	sel.selectedIndex = 0;
}
async function doAction() { // the Actions menu: Undo, Export and Import work at any time (also after death); everything else is one undoable step
	var a = get('actionSelect').value;
	if (a == "undo") return await undoLast();
	if (a == "export") return exportGame();
	if (a == "import") return importGame();
	return await withUndo(doActionRaw);
}
function rightClickOverlay(el, ev) { // the browser menu is suppressed (return false) exactly when the right-click is used; decided at once, the action itself may wait for dialogs
	var used = (el.id == "item:Flask (vending)" && !character.dead && !character.ended) || (el.id.indexOf("wonder:") == 0 && character.raison && character.raison.kind == "wonders") || (el.id.indexOf("curse:") == 0 && has("relics", "Managed Misfortune")) || (el.id.indexOf("foraging:") == 0 && forageToggleable(el.id.substring(9)) && !character.dead && !character.ended);
	if (used && ev && ev.preventDefault) ev.preventDefault();
	withUndo(async function() { return await rightClickOverlayRaw(el, ev); });
	return !used;
}
async function undoLast() {
	if (!undoStack.length) { await uiAlert("Nothing to undo."); return; }
	var e = undoStack.pop();
	var f = flatState();
	Object.keys(e.u).forEach(function(k) { if (e.u[k] === null) delete f[k]; else f[k] = e.u[k]; });
	var log = get('log').value;
	restoreState(stateFromFlat(f), logBefore(log, e.n, e));
	autosave();
}
function savePackage() { return JSON.stringify({game: "AbyssDiver", version: SAVE_VERSION, state: stateJSON(), log: get('log').value, undo: undoStack}); } // the export file: one JSON text with everything
function headerJSON(base, count, logLen, logChunks) { return JSON.stringify({game: "AbyssDiver", version: SAVE_VERSION, state: stateJSON(), base: base, count: count, logLen: logLen, logChunks: logChunks}); }
function clearSave(withHeader) { // removes the undo and log keys of the browser save (and its header too if withHeader)
	var stale = [], i, k;
	for (i = 0; i < localStorage.length; i++) { k = localStorage.key(i); if (k.indexOf(UNDO_KEY) === 0 || k.indexOf(LOG_KEY) === 0) stale.push(k); }
	if (withHeader) stale.push(SAVE_KEY);
	stale.forEach(function(key) { localStorage.removeItem(key); });
	persist = {ok: false, base: 0, count: 0, logLen: 0, logChunks: 0};
}
function storeSave() { // full rewrite of the browser save, including the undo history so Undo keeps working after resuming; if storage is too small the oldest steps are dropped until it fits
	var log = get('log').value, len = undoStack.length, keep = len;
	persist.ok = false;
	for (;;) {
		try {
			clearSave(false);
			var i;
			for (i = len - keep; i < len; i++) localStorage.setItem(UNDO_KEY + i, JSON.stringify(undoStack[i]));
			localStorage.setItem(LOG_KEY + 0, log);
			localStorage.setItem(SAVE_KEY, headerJSON(len - keep, len, log.length, 1));
			persist = {ok: true, base: len - keep, count: len, logLen: log.length, logChunks: 1};
			return keep;
		}
		catch (e) { if (keep == 0) throw e; keep = Math.floor(keep / 2); }
	}
}
function autosave() { // after every action: stores only the new undo step(s) and the new log text, then the header; a full rewrite whenever history was rewritten or an incremental write fails
	try {
		var log = get('log').value, len = undoStack.length;
		if (!persist.ok || len < persist.count || log.length < persist.logLen) { storeSave(); return; }
		var chunks = persist.logChunks;
		for (var i = persist.count; i < len; i++) localStorage.setItem(UNDO_KEY + i, JSON.stringify(undoStack[i]));
		if (log.length > persist.logLen) localStorage.setItem(LOG_KEY + chunks++, log.slice(persist.logLen));
		localStorage.setItem(SAVE_KEY, headerJSON(persist.base, len, log.length, chunks));
		persist.count = len; persist.logLen = log.length; persist.logChunks = chunks; // only now: the header is what makes the new keys count
	} catch (e) { persist.ok = false; try { storeSave(); } catch (e2) {} }
}
function readStored() { // the browser save as one package text for applyPackage: null if there is none, "unreadable" if it is damaged or incomplete
	var raw = null;
	try { raw = localStorage.getItem(SAVE_KEY); } catch (e) { return null; }
	if (!raw) return null;
	try {
		var h = JSON.parse(raw), undo = [], log = "", i, t;
		for (i = h.base; i < h.count; i++) { t = localStorage.getItem(UNDO_KEY + i); if (t === null) throw 0; undo.push(JSON.parse(t)); }
		for (i = 0; i < h.logChunks; i++) { t = localStorage.getItem(LOG_KEY + i); if (t === null) throw 0; log += t; }
		if (log.length !== h.logLen) throw 0;
		return JSON.stringify({game: h.game, version: h.version, state: h.state, log: log, undo: undo});
	} catch (e) { return "unreadable"; }
}
function applyPackage(txt) { // validates a save package and replaces the game with it; false if it is not one
	var pkg;
	try { pkg = JSON.parse(txt); JSON.parse(pkg.state, infReviver); } catch (e) { return false; }
	if (!pkg || pkg.game != "AbyssDiver" || typeof pkg.state != "string" || typeof pkg.log != "string" || !Array.isArray(pkg.undo)) return false;
	if (pkg.version > SAVE_VERSION) return false;
	restoreState(pkg.state, pkg.log);
	undoStack = pkg.undo;
	refreshMenu(); // restoreState built the menu while undoStack was still the old one: rebuild so "Undo last action" shows after resume/load/import
	return true;
}
function exportGame() { // a JSON file with the state, the log and the whole undo history
	var blob = new Blob([savePackage()], {type: "application/json"}), a = document.createElement("a");
	a.href = URL.createObjectURL(blob);
	a.download = "AbyssDiver_save_day" + character.days + ".json";
	document.body.appendChild(a); a.click(); document.body.removeChild(a);
	setTimeout(function() { URL.revokeObjectURL(a.href); }, 1000);
}
function importGame() {
	var inp = document.createElement("input");
	inp.type = "file"; inp.accept = ".json,application/json";
	inp.onchange = function() {
		var f = inp.files && inp.files[0];
		if (!f) return;
		var rd = new FileReader();
		rd.onload = async function() {
			try {
				if (!await uiConfirm("Replace the current game with the one in " + f.name + "?")) return;
				if (!applyPackage(String(rd.result))) await uiAlert("That file is not a valid Abyss Diver save.");
			} catch (e) { if (e !== DLG_CANCEL) throw e; }
		};
		rd.readAsText(f);
	};
	inp.click();
}
async function offerResume() { // on page load: continue the autosaved game if there is one
	var txt = readStored();
	if (!txt) return;
	var day = "?";
	try { day = JSON.parse(JSON.parse(txt).state).character.days; } catch (e) { return; }
	if (!packageChanged(txt)) return; // a save of the untouched initial state has nothing to resume
	if (await uiConfirm("A saved game was found (day " + day + "). Starting a new game deletes it.", "Resume saved game", "Start a new game", true)) applyPackage(txt);
	else { try { clearSave(true); } catch (e) {} }
}
function armMusicStart() { // browsers block autoplay until the page gets a real click/key/tap (scrolling and hovering do not count): wait for one, then start the current track
	var p = get('player'), evs = ['pointerdown', 'pointerup', 'touchend', 'keydown']; // Chrome counts a touch only when the finger lifts, so listen to several and keep trying until play() is accepted
	function disarm() { evs.forEach(function(ev) { document.removeEventListener(ev, onGesture, true); }); }
	function onGesture(e) {
		firstGestureSeen = true;
		if (currentLayer == 0) preloadLayer(1); // first interaction on the Surface: start fetching Layer 1's image and music (safe to repeat: preloadLayer runs once per layer)
		if (e.target === p) { disarm(); return; } // the player's own controls: leave the music to the listener
		if (!p.paused) { disarm(); return; } // already playing
		var pr = p.play(); // must be called inside the gesture
		if (!pr || !pr.then) { disarm(); return; }
		pr.then(function() {
			disarm();
			p.style.opacity = "1"; // make the player visible for a moment so the listener can see the music started and where its controls are
			setTimeout(function() { p.style.opacity = ""; }, MUSIC_PLAYER_SHOW_MS); // back to the stylesheet's faded opacity (hover still brings it to full)
		}, function() {}); // refused (e.g. a touch that is not yet a valid gesture): stay armed for the next event
	}
	evs.forEach(function(ev) { document.addEventListener(ev, onGesture, true); });
}
async function loader() {
	var navContents = "";
	for (var i=0;i<layers.length;i++) {
		var sub = jumpHtml(i, true);
		navContents += "<div class='cell' onclick='navTo(" + i + ")'>" + layers[i][0] + (sub ? "<div class='sub'>" + sub + "</div>" : "") + "</div>";
	}
	(function() { // the log scrolls to the very bottom whenever its text is set, whatever code sets it (new message, undo, load, reset)
		var logEl = get('log'), nativeValue = Object.getOwnPropertyDescriptor(HTMLTextAreaElement.prototype, 'value');
		Object.defineProperty(logEl, 'value', {configurable: true,
			get: function() { return nativeValue.get.call(this); },
			set: function(v) { nativeValue.set.call(this, v); this.scrollTop = this.scrollHeight; }});
		logEl.addEventListener('wheel', function(e) { // slow wheel scrolling: LOG_SCROLL_LINES lines per notch instead of the browser's near-page jump

			notches = Math.max(-2, Math.min(2, notches));

		}, {passive: false});
	})();
	get('navTable').innerHTML = navContents;
	showHideNav();
	showHideInfo();
	gotoPage(0);
	updateInfo();
	get('log').value = firstVisit ? '' : '-Returning visit: Hard Mode New Game+\n';
	armMusicStart();
	await offerResume();
}
