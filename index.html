	cursor : pointer;
	border : 4px solid transparent;
	border-radius : 12px;
}
.overlay:hover {
	border : 4px solid green;
}

.overlay.blocked { cursor : not-allowed; }
.overlay.blocked:hover { border : 4px solid red; }
#tip {

	position : fixed;

	margin-left : 5px;
	padding-right : 5px;

#log {

	right : 5px;
	bottom : 10px;
	width : 33vh;
	height : 14.5vh;

function saveGame(say) {
	try { localStorage.setItem(SAVE_KEY, savePackage(false)); if (say) alert("Game saved in this browser (day " + character.days + "). It is also saved automatically after every action."); }
	catch (e) { alert("Saving in the browser failed (storage unavailable or full). Use 'Export game' instead."); }
}
function applyPackage(txt) { // validates a save package and replaces the game with it; false if it is not one
	var pkg;
	try { pkg = JSON.parse(txt); JSON.parse(pkg.state, infReviver); } catch (e) { return false; }
	if (!pkg || pkg.game != "AbyssDiver" || typeof pkg.state != "string" || typeof pkg.log != "string") return false;
	if (pkg.version > SAVE_VERSION) return false;
	restoreState(pkg.state, pkg.log);
	undoStack = Array.isArray(pkg.undo) ? pkg.undo : [];
	return true;
}
function loadGame() {
	var txt = null;
	try { txt = localStorage.getItem(SAVE_KEY); } catch (e) {}
	if (!txt) { alert("There is no saved game in this browser."); return; }
	if (!confirm("Replace the current game with the saved one? (The undo history of this session is dropped.)")) return;
	if (!applyPackage(txt)) alert("The saved game could not be read.");
}
function exportGame() { // a JSON file with the state, the log and the whole undo history
	var blob = new Blob([savePackage(true)], {type: "application/json"}), a = document.createElement("a");
	a.href = URL.createObjectURL(blob);
	a.download = "AbyssDiver_save_day" + character.days + ".json";
	document.body.appendChild(a); a.click(); document.body.removeChild(a);
	setTimeout(function() { URL.revokeObjectURL(a.href); }, 1000);
}
function importGame() {
	var inp = document.createElement("input");
	inp.type = "file"; inp.accept = ".json,application/json";
	inp.onchange = function() {
		var f = inp.files && inp.files[0];
		if (!f) return;
		var rd = new FileReader();
		rd.onload = function() {
			if (!confirm("Replace the current game with the one in " + f.name + "?")) return;
			if (!applyPackage(String(rd.result))) alert("That file is not a valid Abyss Diver save.");
		};
		rd.readAsText(f);
	};
	inp.click();
}
function offerResume() { // on page load: continue the autosaved game if there is one
	var txt = null;
	try { txt = localStorage.getItem(SAVE_KEY); } catch (e) {}
	if (!txt) return;
	var day = "?";
	try { day = JSON.parse(JSON.parse(txt).state).character.days; } catch (e) { return; }
	if (confirm("A saved game was found (day " + day + "). OK = resume it, Cancel = start a new game (the save is replaced after your first action).")) applyPackage(txt);
}
function loader() {
	var navContents = "";
	for (var i=0;i<layers.length;i++) {
		var sub = jumpHtml(i, true);
		navContents += "<div class='cell' onclick='navTo(" + i + ")'>" + layers[i][0] + (sub ? "<div class='sub'>" + sub + "</div>" : "") + "</div>";
	}
	get('navTable').innerHTML = navContents;
	showHideNav();
	showHideInfo();
	gotoPage(0);
	updateInfo();
	get('log').value = firstVisit ? '' : '-Returning visit: Hard Mode New Game+\n';
	offerResume();
}
</script>
