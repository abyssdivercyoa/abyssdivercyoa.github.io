<!DOCTYPE html>
<html lang="en">
<head>
<title>Abyss Diver</title>
</head>
	
<style>

#navTable .cell:hover { background-color : #222; }
#navTable .sub div:hover, #navJump .jl:hover { background-color : #444; }
.cell {

	background-color : black;
	text-align : left;

}
#pageContainer {

	position : relative;

}
.overlay {

	cursor : pointer;
	border : 4px solid transparent;
	border-radius : 12px;
}
.overlay:hover {
	border : 4px solid green;
}

.overlay.blocked { cursor : not-allowed; }
.overlay.blocked:hover { border : 4px solid red; }

	white-space : pre-line;
	display : none;
	position : fixed;
	z-index : 60;
	max-width : 320px;
	padding : 6px 10px;
	background : #222;
	color : #fff;
	border : 2px solid orange;
	border-radius : 8px;
	font-size : 13px;

}
#infoButton {

	right : 5px;
	top : 5px;

	height : 45px;

	bottom : 10px;
	width : 33vh;
	height : 14.5vh;

	top : 0px;

	color : #fff;

	font-family : inherit;
	font-size : 14px;
	cursor : pointer;

	padding : 6px 8px;
	background : #111;
	color : #fff;
	border : 1px solid gray;
	border-radius : 4px;
	font-family : inherit;
	font-size : 14px;

	try { pkg = JSON.parse(txt); JSON.parse(pkg.state, infReviver); } catch (e) { return false; }
	if (!pkg || pkg.game != "AbyssDiver" || typeof pkg.state != "string" || typeof pkg.log != "string") return false;
	if (pkg.version > SAVE_VERSION) return false;
	restoreState(pkg.state, pkg.log);
	undoStack = Array.isArray(pkg.undo) ? pkg.undo : [];
	refreshMenu(); // restoreState built the menu while undoStack was still the old one: rebuild so "Undo last action" shows after resume/load/import
	return true;
}
async function loadGame() {
	var txt = null;
	try { txt = localStorage.getItem(SAVE_KEY); } catch (e) {}
	if (!txt) { await uiAlert("There is no saved game in this browser."); return; }
	if (!await uiConfirm("Replace the current game with the saved one? (Its saved undo history replaces the current one.)")) return;
	if (!applyPackage(txt)) await uiAlert("The saved game could not be read.");
}
function exportGame() { // a JSON file with the state, the log and the whole undo history
	var blob = new Blob([savePackage(true)], {type: "application/json"}), a = document.createElement("a");
	a.href = URL.createObjectURL(blob);
	a.download = "AbyssDiver_save_day" + character.days + ".json";
	document.body.appendChild(a); a.click(); document.body.removeChild(a);
	setTimeout(function() { URL.revokeObjectURL(a.href); }, 1000);
}
function importGame() {
	var inp = document.createElement("input");
	inp.type = "file"; inp.accept = ".json,application/json";
	inp.onchange = function() {
		var f = inp.files && inp.files[0];
		if (!f) return;
		var rd = new FileReader();
		rd.onload = async function() {
			try {
				if (!await uiConfirm("Replace the current game with the one in " + f.name + "?")) return;
				if (!applyPackage(String(rd.result))) await uiAlert("That file is not a valid Abyss Diver save.");
			} catch (e) { if (e !== DLG_CANCEL) throw e; }
		};
		rd.readAsText(f);
	};
	inp.click();
}
async function offerResume() { // on page load: continue the autosaved game if there is one
	var txt = null;
	try { txt = localStorage.getItem(SAVE_KEY); } catch (e) {}
	if (!txt) return;
	var day = "?";
	try { day = JSON.parse(JSON.parse(txt).state).character.days; } catch (e) { return; }
	try {
		if (await uiConfirm("A saved game was found (day " + day + "). The save is replaced after your first action if you start a new game.\n\nCancel = decide later: nothing changes yet, and Actions \u2192 Load game still resumes the save until your first action.", "Resume it", "Start a new game")) applyPackage(txt);
	} catch (e) { if (e !== DLG_CANCEL) throw e; }
}
async function loader() {
	var navContents = "";
	for (var i=0;i<layers.length;i++) {
		var sub = jumpHtml(i, true);
		navContents += "<div class='cell' onclick='navTo(" + i + ")'>" + layers[i][0] + (sub ? "<div class='sub'>" + sub + "</div>" : "") + "</div>";
	}
	get('navTable').innerHTML = navContents;
	showHideNav();
	showHideInfo();
	gotoPage(0);
	updateInfo();
	get('log').value = firstVisit ? '' : '-Returning visit: Hard Mode New Game+\n';
	initialFlat = flatState();
	updateInfo(); // refresh the menu against the baseline
	await offerResume();
}
</script>
